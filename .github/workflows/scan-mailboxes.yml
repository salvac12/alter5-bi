name: Scan Gmail Mailboxes

on:
  schedule:
    - cron: '0 2 * * *'  # 02:00 UTC = 04:00 Madrid
  workflow_dispatch:
    inputs:
      days:
        description: 'Override scan window (number of days to look back)'
        required: false
        default: ''
        type: string
      reenrich:
        description: 'Re-enrich companies without enrichment (skip Gmail scan)'
        required: false
        default: false
        type: boolean
      max_results:
        description: 'Cap mensajes por buzón (default 500, subir para backfills)'
        required: false
        default: ''
        type: string
      fix_subjects:
        description: 'Fix dated_subjects: stuck (30 old), empty, or all'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - stuck
          - empty
          - all

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan mailboxes
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INPUT_DAYS: ${{ github.event.inputs.days }}
          INPUT_REENRICH: ${{ github.event.inputs.reenrich }}
          INPUT_MAX_RESULTS: ${{ github.event.inputs.max_results }}
        run: |
          DAYS_ARG=""
          if [ -n "$INPUT_DAYS" ]; then
            DAYS_ARG="--days $INPUT_DAYS"
          fi
          REENRICH_ARG=""
          if [ "$INPUT_REENRICH" = "true" ]; then
            REENRICH_ARG="--reenrich"
          fi
          MAX_RESULTS_ARG=""
          if [ -n "$INPUT_MAX_RESULTS" ]; then
            MAX_RESULTS_ARG="--max-results $INPUT_MAX_RESULTS"
          fi
          python scripts/scan_mailboxes.py $DAYS_ARG $REENRICH_ARG $MAX_RESULTS_ARG

      - name: Fix dated_subjects
        if: ${{ github.event.inputs.fix_subjects != '' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          INPUT_FIX_SUBJECTS: ${{ github.event.inputs.fix_subjects }}
        run: python scripts/fix_stuck_subjects.py "--$INPUT_FIX_SUBJECTS"

      - name: Scan calendars for meetings
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/scan_calendars.py

      - name: Sync Airtable opportunities
        if: ${{ env.AIRTABLE_PAT != '' }}
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
        run: python scripts/sync_airtable_opportunities.py

      - name: Commit and push if changed
        run: |
          git config user.name "alter5-bi-bot"
          git config user.email "bot@alter5.com"
          for f in src/data/companies.json src/data/companies_full.json src/data/employees.json src/data/opportunities.json config/scan_state.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "data: actualizacion automatica desde Gmail API directo

          $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt..."
            git pull --rebase origin main || {
              echo "Rebase failed (probably scan_state.json conflict). Re-applying our commit on top of remote."
              git rebase --abort || true
              git fetch origin main
              git reset --soft origin/main
              for f in src/data/companies.json src/data/companies_full.json src/data/employees.json src/data/opportunities.json config/scan_state.json; do
                [ -f "$f" ] && git add "$f"
              done
              git diff --cached --quiet && { echo "Nothing left to commit after reset"; exit 0; }
              git commit -m "data: actualizacion automatica desde Gmail API directo

          $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }
            git push && exit 0
            echo "Push rejected, sleeping before retry..."
            sleep 10
          done
          echo "ERROR: Push failed after 5 attempts."
          exit 1
